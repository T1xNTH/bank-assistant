[project]
name = "bank-assistant"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["integration: needs docker compose services"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "."]
extend-exclude = ["scripts/validate-framework.py"]  # vendored from agentic-sdlc-kit

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
