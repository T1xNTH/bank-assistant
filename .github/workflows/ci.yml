name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python scripts/validate-framework.py

  backend-smoke:
    name: backend-smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: infrastructure/compose.yaml:infrastructure/compose.ci.yaml
      COMPOSE_PROJECT_NAME: bank-assistant-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate ephemeral gateway key
        run: echo "LITELLM_MASTER_KEY=sk-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start API, Qdrant and Redis
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Tag the built API image for scanning
        id: api-image
        run: docker tag "$(docker compose images -q api)" "bank-assistant-ci:$GITHUB_SHA"
      - name: Exercise the running API and Qdrant
        run: docker compose exec -T api python - --qdrant-url http://qdrant:6333 < scripts/smoke_api.py
      - name: Check Redis
        run: docker compose exec -T redis redis-cli -e ping
      - name: Trivy API image (fixable CRITICAL vulnerabilities)
        if: ${{ !cancelled() && steps.api-image.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: bank-assistant-ci:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy-api.json
          timeout: 10m
      - name: Upload Trivy report even when the scan fails
        if: ${{ always() && steps.api-image.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-api.json
          if-no-files-found: error
          retention-days: 14
      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  eval-changes:
    # A pull request that cannot change RAG answers (docs, UI, records) skips the paid real-model gate;
    # pushes to main and manual runs always evaluate. Paths: docs/07-development/ci.md "Eval gate".
    name: eval-changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      eval: ${{ steps.paths.outputs.eval }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Does this change reach RAG answers or the eval?
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "eval=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          printf '%s\n' "$changed"
          pattern='^(src/app/rag/|src/app/(prompts|llm|routing|contracts)\.py$|src/app/security/masking\.py$|eval/|scripts/(select_ci_golden|qdrant_backup)\.py$|infrastructure/compose\.yaml$|infrastructure/litellm/|requirements[^/]*\.txt$|data/manifest\.csv$|\.github/workflows/)'
          if printf '%s\n' "$changed" | grep -qE "$pattern"; then
            echo "eval=true" >> "$GITHUB_OUTPUT"
          else
            echo "eval=false" >> "$GITHUB_OUTPUT"
            echo "No RAG/eval path changed: eval-gate is skipped for this pull request." >> "$GITHUB_STEP_SUMMARY"
          fi

  eval-gate:
    name: eval-gate
    needs: [quality, eval-changes]
    if: ${{ needs.eval-changes.outputs.eval == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: infrastructure/compose.yaml
      COMPOSE_PROJECT_NAME: bank-eval-${{ github.run_id }}-${{ github.run_attempt }}
      LLM_BACKEND: litellm
      RAG_BACKEND: real
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: bank_docs
      LLM_BASE_URL: http://127.0.0.1:4000
      RERANK_CANDIDATES: '8'
      REFUSAL_THRESHOLD: '0.5'
      JUDGE_MODEL: cloud-chat
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Require the real-model CI credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::error::Set Actions secret OPENAI_API_KEY for real eval. Fork PRs need a trusted maintainer branch; this gate does not silently skip.'
            exit 1
          fi
          key="sk-$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          echo "LITELLM_MASTER_KEY=$key" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-eval.txt
      - run: python -m pip install -r requirements-eval.txt
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: eval-models-${{ runner.os }}-${{ hashFiles('requirements.txt', 'src/app/rag/embed.py', 'src/app/rag/rerank.py') }}
      - name: Select ten original golden questions
        run: python scripts/select_ci_golden.py --out output/ci-eval/golden.jsonl
      - name: Download the pinned corpus snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download qdrant-bank_docs-2026-11-05-2819 --repo T1xNTH/bank-assistant --dir output/ci-eval/snapshot
          cd output/ci-eval/snapshot
          echo 'e03749c9f0487f153013a577f15b026e29b6710ee3f819d279003a8f3a4fa4d3  bank_docs-2819-2026-11-05.snapshot' | sha256sum --check -
      - name: Start Qdrant and authenticated real-model gateway
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
        run: docker compose up -d --wait --wait-timeout 180 qdrant litellm
      - name: Restore snapshot (checksum and exact count verified)
        run: python scripts/qdrant_backup.py restore --backup-dir output/ci-eval/snapshot
      - name: Evaluate current RAG code and enforce unchanged thresholds
        run: >-
          python eval/run.py --mode hybrid_rerank --golden output/ci-eval/golden.jsonl
          --check --out output/ci-eval/report.md --results output/ci-eval/results
      - name: Publish eval summary even on threshold failure
        if: ${{ always() && hashFiles('output/ci-eval/report.md') != '' }}
        run: cat output/ci-eval/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload eval evidence even on failure
        if: ${{ always() && hashFiles('output/ci-eval/golden.jsonl') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci-eval/golden.jsonl
            output/ci-eval/report.md
            output/ci-eval/results/
            output/ci-eval/snapshot/backup.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove isolated eval services and volumes
        if: ${{ always() && env.LITELLM_MASTER_KEY != '' }}
        run: docker compose down --volumes --remove-orphans

  ui-syntax:
    name: ui-syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Compile UI Python files
        run: |
          test -f ui/app.py
          python -m compileall -q ui
      - name: Describe current UI coverage
        run: |
          echo 'UI coverage: syntax here; Streamlit AppTest flows against the API run in quality (tests/unit/test_ui.py). No browser E2E.' >> "$GITHUB_STEP_SUMMARY"

  check:
    # Keep the existing required-check name, but require every CI job to succeed. eval-gate may be
    # skipped only when eval-changes ran and found no RAG/eval path in the pull request.
    needs: [quality, backend-smoke, ui-syntax, eval-changes, eval-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BACKEND_RESULT: ${{ needs.backend-smoke.result }}
          UI_RESULT: ${{ needs.ui-syntax.result }}
          EVAL_RESULT: ${{ needs.eval-gate.result }}
          CHANGES_RESULT: ${{ needs.eval-changes.result }}
          EVAL_NEEDED: ${{ needs.eval-changes.outputs.eval }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$UI_RESULT" = success
          test "$CHANGES_RESULT" = success
          if [ "$EVAL_NEEDED" = false ]; then
            test "$EVAL_RESULT" = skipped
          else
            test "$EVAL_RESULT" = success
          fi
