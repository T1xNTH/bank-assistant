name: Compose and Qdrant recovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/compose-recovery.yml
      - infrastructure/compose.yaml
      - Makefile
      - scripts/qdrant_backup.py
      - scripts/smoke_qdrant_backup.py
permissions:
  contents: read
concurrency:
  group: compose-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  make-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: make check PY=python
  profiles-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: t040-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install httpx2
      - name: Create ephemeral local configuration
        run: printf 'LITELLM_MASTER_KEY=sk-%s\n' "$(openssl rand -hex 32)" > .env.local
      - name: Independently start each profile and verify Make recovery
        run: |
          set -euo pipefail
          for profile in local-llm automation obs; do
            make up PROFILE="$profile"
            make smoke
            docker compose -f infrastructure/compose.yaml --env-file .env.local --profile "$profile" ps
            python scripts/smoke_qdrant_backup.py
            echo "PROFILE_PASS: $profile"
            make down PROFILE="$profile"
          done
      - name: Show status and logs
        if: always()
        run: |
          docker compose -f infrastructure/compose.yaml --env-file .env.local --profile '*' ps --all
          docker compose -f infrastructure/compose.yaml --env-file .env.local --profile '*' logs --no-color --tail 100
      - name: Remove ephemeral CI containers and volumes
        if: always()
        run: docker compose -f infrastructure/compose.yaml --env-file .env.local --profile '*' down --volumes --remove-orphans
