# Core services; enable Ollama with --profile local-llm.
services:
  api:
    build: {context: .., dockerfile: infrastructure/docker/Dockerfile}
    # Explicit allowlist: provider credentials belong only to the gateway.
    environment:
      RAG_BACKEND: ${RAG_BACKEND:-fake}
      LLM_BACKEND: ${LLM_BACKEND:-fake}
      AUTH_BACKEND: ${AUTH_BACKEND:-fake}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-bank_docs}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid_rerank}
      REFUSAL_THRESHOLD: ${REFUSAL_THRESHOLD:-}
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set a random sk- prefixed gateway key in .env.local}
      API_KEYS_FILE: ${API_KEYS_FILE:-config/api_keys.json}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse:3000}
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [qdrant, redis, litellm]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  litellm:
    image: ghcr.io/berriai/litellm:v1.106.6
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: openai/${OPENAI_MODEL:-gpt-6-luna}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set a random sk- prefixed gateway key in .env.local}
    volumes: [./litellm/config.yaml:/app/config.yaml:ro]
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
  ollama:
    image: ollama/ollama:0.40.13
    profiles: [local-llm]
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  qdrant_data:
  ollama_data:
